services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.runCommand({ ping: 1 })"]
      interval: 10s
      timeout: 5s
      retries: 10

  server:
    build:
      context: ./server
    restart: unless-stopped
    environment:
      NODE_ENV: development
      TRUST_PROXY: "true"
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DB_NAME: campusdrive_ai
      APP_URL: http://localhost
      APP_JWT_SECRET: change-me-in-production
      EMAIL_MODE: mock
      STORAGE_MODE: local
      COMM_QUEUE_BACKEND: inline
    depends_on:
      - mongo
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10

  client:
    build:
      context: ./client
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "80:80"

volumes:
  mongo_data:
