# Render is the primary pilot launch target for this repo.
# Backend APP_URL must be set to the public client URL in the Render dashboard.
# Frontend API_UPSTREAM must point to the public backend Render URL.
services:
  - type: web
    name: smartpath-server
    env: docker
    rootDir: server
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: TRUST_PROXY
        value: true

  - type: web
    name: smartpath-client
    env: docker
    rootDir: client
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    healthCheckPath: /
    envVars:
      - key: API_UPSTREAM
        value: https://smartpath-server.onrender.com # replace with your actual backend Render URL
