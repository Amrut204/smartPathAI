services:
  server:
    build:
      context: ./server
    restart: unless-stopped
    env_file:
      - ./ops/digitalocean/server.env
    environment:
      NODE_ENV: production
      TRUST_PROXY: "true"
      PORT: 5000
    expose:
      - "5000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  client:
    build:
      context: ./client
    restart: unless-stopped
    environment:
      API_UPSTREAM: http://server:5000
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
